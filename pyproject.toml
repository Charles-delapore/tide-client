[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tide-client"
version = "0.1.0"
description = "Unified tide-gauge and sea-level time-series client for PSMSL, UHSLC, SONEL and NOAA CO-OPS"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Charles-delapore" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
]
keywords = ["tide gauge", "sea level", "PSMSL", "UHSLC", "SONEL", "NOAA", "ocean"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
xarray = ["xarray>=2023.1"]
dev = ["ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/Charles-delapore/tide-client"
Source = "https://github.com/Charles-delapore/tide-client"

[tool.setuptools.packages.find]
include = ["tide_client*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
